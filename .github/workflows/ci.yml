name: TradingLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile tracked Python source
        shell: pwsh
        run: |
          $paths = @(
            'Regime trading/RegimeTrading',
            'Regime trading/tests',
            'Regime trading/tools',
            'Swing/core',
            'Swing/tests',
            'Swing/scripts/run_canonical_backtest.py',
            'Pattern Trading/black_friday_event_study/src',
            'Pattern Trading/labor_day_event_study/src',
            'Pattern Trading/labor_day_event_study/tests',
            'Pattern Trading/black_friday_event_study/run_pipeline.py',
            'Pattern Trading/labor_day_event_study/audit_prices.py',
            'Pattern Trading/labor_day_event_study/universe.py',
            'Intraday/core',
            'Intraday/scripts'
          )
          python -B -m compileall -q $paths

      - name: Parse project PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '\\.venv\\|__pycache__' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failed: $($file.FullName)"
            }
          }

      - name: Check Git whitespace
        shell: pwsh
        run: git diff --check

  regime-trading:
    name: Regime Trading focused checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Regime trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run project validation without local-data workflows
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\tools\run_project_validation.ps1 -StaticOnly -PythonPath $python
      - name: Run canonical safety tests
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_step9_morning_v2_install_contract.py
          tests/test_step9_morning_v2_support.py
          tests/test_step9_full_morning_safety_v1.py

  swing:
    name: Swing checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Swing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile canonical source
        run: >-
          python -B -m compileall -q core tests
      - name: Compile canonical runner
        run: python -B -m py_compile scripts/run_canonical_backtest.py
      - name: Run canonical tests
        run: python -B -m unittest discover -s tests -v

  pattern-trading:
    name: Pattern Trading checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Pattern Trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile active research projects
        run: >-
          python -B -m compileall -q
          black_friday_event_study/src
          labor_day_event_study/src
          labor_day_event_study/tests
      - name: Compile research entry points
        run: >-
          python -B -m py_compile
          black_friday_event_study/run_pipeline.py
          labor_day_event_study/audit_prices.py
          labor_day_event_study/universe.py
      - name: Run reproducible Labor Day tests
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_event_dates.py
          tests/test_universe.py
          tests/test_contamination.py
          tests/test_no_lookahead.py
        working-directory: Pattern Trading/labor_day_event_study

  intraday:
    name: Intraday static checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Intraday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research and paper-trading code
        run: python -B -m compileall -q core scripts
